<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="30%" stop-color="#d4a373" />
      <stop offset="100%" stop-color="#8b5e34" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Main bean body -->
  <path d="M50 85 C20 85, 15 60, 25 35 C35 10, 65 15, 75 40 C85 65, 80 85, 50 85 Z" fill="none" stroke="url(#goldGradient)" stroke-width="4" filter="url(#glow)"/>
  <!-- Inner S curve -->
  <path d="M35 30 Q50 50 45 70" fill="none" stroke="url(#goldGradient)" stroke-width="3" filter="url(#glow)"/>
  <path d="M55 30 Q50 50 65 70" fill="none" stroke="url(#goldGradient)" stroke-width="3" filter="url(#glow)"/>
  <!-- Subtle leaf accent -->
  <path d="M70 25 Q85 15 90 30 Q75 40 70 25 Z" fill="url(#goldGradient)" opacity="0.8"/>
</svg>
