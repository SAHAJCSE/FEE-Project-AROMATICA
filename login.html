<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup | Aromatica</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-wrapper {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('./images/hero/login-bg.png') center/cover no-repeat;
            position: relative;
        }
        .auth-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
        }
        .auth-card {
            width: 100%;
            max-width: 500px;
            padding: 2.5rem;
            border-radius: 4px; /* Truly square shape with very subtle rounding */
            position: relative;
            z-index: 1;
            animation: slideIn 0.8s ease-out;
            max-height: 90vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hidden { display: none; }
        .auth-header { text-align: center; margin-bottom: 2.5rem; }
        .auth-header h2 { font-size: 2rem; color: var(--primary-color); }
        .auth-header p { color: var(--text-muted); margin-top: 0.5rem; }
        
        .social-auth {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }
        .social-btn {
            width: 100%;
            padding: 0.8rem;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: var(--transition);
        }
        .social-btn:hover { background: rgba(255,255,255,0.15); }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 2rem 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--glass-border);
            margin: 0 1rem;
        }

        .auth-footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .auth-footer span {
            color: var(--primary-color);
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="glass auth-card">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <a href="index.html" class="logo">AROMATICA</a>
            </div>

            <!-- Login Form -->
            <div id="login-form">
                <div class="auth-header">
                    <h2>Welcome Back</h2>
                    <p>Log in to manage your reservations</p>
                </div>
                <form id="signin-form">
                    <div class="form-group" style="margin-bottom: 1.2rem;">
                        <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Email Address</label>
                        <input type="email" id="signin-email" placeholder="email@example.com" required style="width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 5px; color: var(--text-light); outline: none;">
                    </div>
                    <div class="form-group" style="margin-bottom: 1.2rem;">
                        <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Password</label>
                        <input type="password" id="signin-password" placeholder="••••••••" required minlength="6" autocomplete="current-password" style="width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 5px; color: var(--text-light); outline: none;">
                    </div>
                    <div style="text-align: right; margin-bottom: 1.5rem;">
                        <a href="#" style="color: var(--primary-color); font-size: 0.85rem;">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Log In</button>
                </form>
                <div class="divider">OR CONTINUE WITH</div>
                <button class="social-btn"><i class="fab fa-google"></i> Google</button>
                <div class="auth-footer">
                    Don't have an account? <span onclick="toggleAuthMode()" id="auth-toggle-btn">Sign Up</span>
                </div>
            </div>

            <!-- Signup Form (Hidden by default) -->
            <div id="signup-form" class="hidden">
                <div class="auth-header">
                    <h2>Create Account</h2>
                    <p>Join the Aromatica luxury circle</p>
                </div>
                <form id="register-form">
                    <div class="form-group" style="margin-bottom: 1.2rem;">
                        <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Full Name</label>
                        <input type="text" id="signup-name" placeholder="John Doe" required style="width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 5px; color: var(--text-light); outline: none;">
                    </div>
                    <div class="form-group" style="margin-bottom: 1.2rem;">
                        <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Email Address</label>
                        <input type="email" id="signup-email" placeholder="email@example.com" required style="width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 5px; color: var(--text-light); outline: none;">
                    </div>
                    <div class="form-group" style="margin-bottom: 1.2rem;">
                        <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Password</label>
                        <input type="password" id="signup-password" placeholder="••••••••" required minlength="6" autocomplete="new-password" style="width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 5px; color: var(--text-light); outline: none;">
                    </div>
                    <div class="form-group" style="margin-bottom: 1.2rem;">
                        <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Confirm Password</label>
                        <input type="password" id="signup-confirm-password" placeholder="••••••••" required minlength="6" autocomplete="new-password" style="width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 5px; color: var(--text-light); outline: none;">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Sign Up</button>
                </form>
                <div class="auth-footer">
                    Already have an account? <span onclick="toggleAuthMode()">Log In</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="firebase-service.js"></script>
    <script src="script.js"></script>
</body>
</html>
